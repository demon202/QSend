name: Deploy QSend to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Build job ─────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify frontend files
        run: |
          echo "Checking required files..."
          test -f index.html   && echo "✓ index.html"
          test -f app.js       && echo "✓ app.js"
          test -f sw.js        && echo "✓ sw.js"
          test -f manifest.json && echo "✓ manifest.json"
          echo "All required files present."

      - name: Report file sizes
        run: |
          echo "=== Bundle sizes ==="
          du -sh index.html app.js sw.js manifest.json 2>/dev/null || true
          echo "Total HTML+JS:"
          cat index.html app.js | wc -c | awk '{printf "%.1f KB\n", $1/1024}'

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository root (frontend files only)
          path: '.'

  # ── Deploy job ────────────────────────────────────────────────
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4